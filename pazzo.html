<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Photo Card</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .card {
            width: 100%;
            max-width: 448px;
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            transition: transform 300ms ease-in-out;
        }
        .card:hover {
            transform: scale(1.02);
        }
        .image-area {
            position: relative;
            height: 256px;
        }
        .image-area img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .badge {
            position: absolute;
            top: 16px;
            right: 16px;
            background-color: #4f46e5;
            color: #ffffff;
            font-size: 12px;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 9999px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        .content-area {
            padding: 32px;
        }
        .title {
            font-size: 24px;
            font-weight: 700;
            color: #1f2937;
            margin-bottom: 8px;
            line-height: 1.25;
        }
        .subtitle {
            font-size: 14px;
            color: #4f46e5;
            font-weight: 500;
            margin-bottom: 16px;
        }
        .description {
            color: #4b5563;
            margin-bottom: 24px;
            font-size: 16px;
        }
        .button-container {
            display: flex;
            justify-content: flex-end;
        }
        .action-button {
            background-color: #10b981;
            color: #ffffff;
            font-weight: 600;
            padding: 8px 24px;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            transition: background-color 200ms ease;
            border: none;
            cursor: pointer;
        }
        .action-button:hover {
            background-color: #059669;
        }
    </style>
</head>
<body class="p-4">

    <div class="card">
        <div class="image-area">
            <img 
                src="" 
                alt="A beautiful mountain view"
                onerror="this.onerror=null;this.src='https://placehold.co/800x600/6b7280/ffffff?text=Image+Unavailable'"
            >
            <span class="badge">
                FEATURED
            </span>
        </div>

        <div class="content-area">
            <h2 class="title">
                The Alpine Ascent
            </h2>
            <p class="subtitle">
                Captured by Alex Johnson, 2025
            </p>
            <p class="description">
                An incredible shot detailing the rugged beauty and serene isolation of the high mountain trails. Perfect for desktop wallpaper or print.
            </p>

            <div class="button-container">
                <button 
                    class="action-button"
                    type="button"
                >
                    View Details
                </button>
            </div>
        </div>
    </div>
</body>
</html>
